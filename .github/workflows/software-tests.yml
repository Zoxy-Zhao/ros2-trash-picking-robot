name: Software tests
on: [push, pull_request]
jobs:
  motion-and-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q robot_arm robot_core robot_vision robot_serial robot_launch tools
  ros-humble-integration:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-numpy python3-colcon-common-extensions
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y --rosdistro humble
      - name: Build and exercise generated service interfaces
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args -DBUILD_TESTING=OFF
          source install/setup.bash
          python3 tools/check_ros_integration.py
